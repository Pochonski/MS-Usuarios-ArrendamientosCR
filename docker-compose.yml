# docker-compose.yml — Entorno local para MS-Usuarios Boot
# Levanta SQL Server 2022 + la app Spring Boot conectados.
# Uso:
#   docker compose up --build
#   curl http://localhost:8080/api/health

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ms-usuarios-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ms-usuarios-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-usuarios-boot:local
    container_name: ms-usuarios-boot
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: usuarios_db
      DB_USER: sa
      DB_PASSWORD: "YourStrong!Passw0rd"
      JWT_SECRET: "local-dev-secret-change-me-please-32-chars-min"
      JWT_EXPIRES_IN: 24h
      GOOGLE_CLIENT_ID: ""
      APIM_SUBSCRIPTION_KEY: ""
      APIM_VALIDATE_CLIENT_CERT: "false"
      RL_AUTH_MAX: 100
      RL_READ_MAX: 1000
      RL_WRITE_MAX: 500
    ports:
      - "8080:8080"
    networks:
      - ms-usuarios-net
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local

networks:
  ms-usuarios-net:
    driver: bridge
