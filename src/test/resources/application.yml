spring:
  datasource:
    url: jdbc:h2:mem:msusuariostest;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  main:
    banner-mode: off

server:
  port: 0

app:
  jwt:
    secret: test_secret_for_jest_12345678901234567890
    expires-in: 1h
    refresh-expires-in: 7d
    email-verification-expires-in: 24h
  apim:
    subscription-key: test-subscription-key
    client-cert-thumbprint: ""
    validate-client-cert: false
    internal-api-url: ""
    skip-paths:
      - /api/health
      - /actuator/**
  google:
    client-id: test-google-client-id
    allowed-domain: ""
  email-verification:
    frontend-base-url: http://localhost:3000
  rate-limit:
    window-minutes: 15
    auth-max: 5
    read-max: 200
    write-max: 50
    general-max: 100
  cors:
    allowed-origins:
      - "*"
  lockout:
    max-attempts: 5
    duration-minutes: 15
  token-revocation:
    cleanup-after-days: 7
  bcrypt:
    strength: 4
  security:
    endpoints-public:
      - /api/auth/login
      - /api/auth/registro
      - /api/auth/google
      - /api/auth/verify-email/**
      - /api/health
      - /api/docs
      - /api/docs/**
      - /api/v3/api-docs
      - /api/v3/api-docs/**
      - /api/swagger-ui/**
      - /api/swagger-ui.html
      - /api/actuator/**
    apim-filter-enabled: false
    rate-limit-enabled: false

# Mirror prod config: actuator + OpenAPI/Swagger bajo /api/ para que el SWA
# los pueda proxiar. En src/test/resources/application.yml REEMPLAZA al
# src/main/resources/application.yml (no lo merge), así que hay que duplicarlo.
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: WARN
    com.arrendamientos.usuarios: INFO
    org.hibernate.SQL: WARN
