app:
  jwt:
    secret: test_secret_for_jest_12345678901234567890
    expires-in: 1h
    refresh-expires-in: 7d
    email-verification-expires-in: 24h
  apim:
    validate-client-cert: false
  google:
    client-id: test-google-client-id
  security:
    endpoints-public:
      - /api/auth/**
      - /api/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/**
  email:
    provider: logging
    from-address: test@example.com
    from-display-name: "Test"
  refresh:
    rotation-enabled: false

logging:
  level:
    root: WARN
    com.arrendamientos.usuarios: INFO
