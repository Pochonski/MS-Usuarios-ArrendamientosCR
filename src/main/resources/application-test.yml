app:
  jwt:
    secret: test_secret_for_jest_12345678901234567890
    expires-in: 1h
    refresh-expires-in: 7d
    email-verification-expires-in: 24h
  apim:
    validate-client-cert: false
  google:
    client-id: test-google-client-id
  security:
    endpoints-public:
      - /api/auth/**
      - /api/auth/login
      - /api/auth/registro
      - /api/auth/google
      - /api/auth/github
      - /api/auth/verify-email/**
      - /api/propiedades
      - /api/propiedades/**
      - /api/health
      - /api/docs
      - /api/docs/**
      - /api/v3/api-docs
      - /api/v3/api-docs/**
      - /api/swagger-ui/**
      - /api/swagger-ui.html
      - /api/actuator/**

logging:
  level:
    root: WARN
    com.arrendamientos.usuarios: INFO
